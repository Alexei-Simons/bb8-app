name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    value: |
      We welcome ideas. Please check the [roadmap](https://github.com/Alexei-Simons/bb8-app#roadmap) and existing issues first.

      **Developers:** after discussion, reference this issue in your PR with `Closes #<number>`.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve for BB-8 owners?
      placeholder: I want to ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drive / controls
        - Battery / diagnostics
        - BLE / connectivity
        - Macros / automation
        - Sensor streaming
        - UI / UX
        - Documentation
        - Build / release
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this (linked to this issue)
